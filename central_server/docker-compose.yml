# Central Server docker-compose stack
#
# Một .env chung cho cả repo — root .env (docker compose tự nạp khi
# project directory = gốc repo). KHÔNG còn central_server/.env riêng.
#
# Chạy từ GỐC repo (lưu ý --project-directory để nạp root .env và giữ
# project name cố định — cũng là tiền tố của volumes):
#   docker compose --project-directory . -f central_server/docker-compose.yml up -d
#
# Chạy trong thư mục central_server/ vẫn được: compose nạp .env từ project
# directory (gốc repo) — dùng khi chỉ chỉnh service central.
#   cd central_server && docker compose --project-directory .. up -d

name: rlvd

networks:
  rlvd-net:
    external: true
    name: rlvd-net

services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rlvd_central
      POSTGRES_USER: rlvd
      # Production: đổi trong root .env (không dùng default)
      POSTGRES_PASSWORD: ${DB_PASS:-rlvd_secret}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rlvd -d rlvd_central"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rlvd-net

  # ---------- MinIO (S3-compatible object storage) ----------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      # Production: đổi MINIO_ROOT_USER/PASSWORD + MINIO_ACCESS_KEY/SECRET_KEY trong root .env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rlvd-net

  # ---------- Central Server (Spring Boot) ----------
  central-server:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rlvd_central
      DB_USER: rlvd
      DB_PASS: ${DB_PASS:-rlvd_secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: violations
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # --- Auth (JWT cho web, ingest token cho edge) ---
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-43200}
      INGEST_TOKEN: ${INGEST_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - rlvd-net

volumes:
  postgres_data:
  minio_data:
