server:
  port: 8000

spring:
  application:
    name: central-server

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rlvd_central}
    username: ${DB_USER:rlvd}
    password: ${DB_PASS:rlvd_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  jackson:
    serialization:
      write-dates-as-timestamps: false
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Ho_Chi_Minh

# MinIO Object Storage
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:violations}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.rlvd: INFO
    org.hibernate.SQL: WARN

# AI Text-to-SQL (Gemini)
ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}

# Bảo mật — JWT cho web users, ingest token cho node biên
jwt:
  secret: ${JWT_SECRET:}
  ttl-seconds: ${JWT_TTL_SECONDS:43200}

security:
  ingest-token: ${INGEST_TOKEN:}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin123}
