server:
  port: 8000
  # Graceful shutdown: chờ các request đang xử lý hoàn tất (tối đa 30s)
  # trước khi tắt — tránh đứt batch ingest từ node biên giữa chừng.
  shutdown: graceful

spring:
  application:
    name: central-server

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rlvd_central}
    username: ${DB_USER:rlvd}
    password: ${DB_PASS:rlvd_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Pool connection PostgreSQL — 10 connection mặc định là đủ cho
      # dashboard + vài chục node biên; bật trần rõ ràng để tránh
      # mở connection vô hạn khi central chịu tải cao.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  jackson:
    serialization:
      write-dates-as-timestamps: false
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Ho_Chi_Minh

# MinIO Object Storage
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:violations}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.rlvd: INFO
    org.hibernate.SQL: WARN

# AI Text-to-SQL (Gemini)
ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}

# Bảo mật — JWT cho web users, ingest token cho node biên
jwt:
  secret: ${JWT_SECRET:}
  ttl-seconds: ${JWT_TTL_SECONDS:43200}

security:
  ingest-token: ${INGEST_TOKEN:}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin123}
