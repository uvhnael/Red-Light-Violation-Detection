# Full stack: Edge Node + Central Server + Web Dashboard
# Run from project root: docker compose -f docker-compose.full.yml up -d

services:
  # ========== CENTRAL SERVER STACK ==========

  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rlvd_central
      POSTGRES_USER: rlvd
      # Production: đặt POSTGRES_PASSWORD / DB_PASS trong .env (không dùng default)
      POSTGRES_PASSWORD: ${DB_PASS:-rlvd_secret}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rlvd -d rlvd_central"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rlvd-net

  # ---------- MinIO (S3-compatible object storage) ----------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      # Production: đổi MINIO_ROOT_USER/PASSWORD + MINIO_ACCESS_KEY/SECRET_KEY trong .env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rlvd-net

  # ---------- Central Server (Spring Boot) ----------
  central-server:
    build:
      context: ./central_server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - ./central_server/.env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rlvd_central
      DB_USER: rlvd
      DB_PASS: ${DB_PASS:-rlvd_secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: violations
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # --- Auth (JWT cho web, ingest token cho edge) ---
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-43200}
      INGEST_TOKEN: ${INGEST_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - rlvd-net

  # ========== FRONTEND DASHBOARD ==========

  web-dashboard:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Rewrites destinations are baked at build time — point at Docker service names
        CENTRAL_SERVER_URL: http://central-server:8000
        EDGE_SERVER_URL: http://edge-pipeline:8080
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      central-server:
        condition: service_healthy
    environment:
      CENTRAL_SERVER_URL: http://central-server:8000
      EDGE_SERVER_URL: http://edge-pipeline:8080
      TZ: Asia/Ho_Chi_Minh
    networks:
      - rlvd-net

  # ========== EDGE NODE STACK ==========
  # (Redis/Celery đã bị loại bỏ — vi phạm gửi qua durable outbox trực tiếp
  #  tới central-server, không cần broker trung gian.)

  # ---------- Edge Vision Pipeline + Control API ----------
  edge-pipeline:
    build:
      context: .
      dockerfile: edge_node/Dockerfile
    restart: unless-stopped
    command: >
      python -m edge_node
        --input ${VIDEO_INPUT:-data/videos/16h30.25.9.22.mp4}
        ${STOP_LINE:+--stop-line ${STOP_LINE}}
        --direction ${CROSSING_DIRECTION:-any}
        --start-api
        --loop
    ports:
      - "8082:8080"
    environment:
      CENTRAL_SERVER_URL: http://central-server:8000/api/violations
      # Must match the --input CLI arg: the control-plane API reads
      # settings.video_input for /api/cameras and /api/calibration/snapshot.
      VIDEO_INPUT: ${VIDEO_INPUT:-data/videos/16h30.25.9.22.mp4}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-models/yolo26m_vehicle.pt}
      YOLO_DEVICE: ${YOLO_DEVICE:-}
      NODE_ID: ${NODE_ID:-edge-node-01}
      # Live HLS camera feed (served at /api/cameras for the web dashboard)
      CAMERA_STREAM_ENABLED: "true"
      CAMERA_STREAM_HLS_DIR: /tmp/hls/cam-1
      CAMERA_NAME: ${CAMERA_NAME:-}
      CAMERA_LOCATION: ${CAMERA_LOCATION:-}
      # Durable outbox (survives network outages + container restarts)
      OUTBOX_ENABLED: "true"
      OUTBOX_DB_PATH: /app/outbox/violations.db
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_FLUSH_INTERVAL: ${OUTBOX_FLUSH_INTERVAL:-5}
      # --- Bảo mật control-plane + ingest ---
      EDGE_API_TOKEN: ${EDGE_API_TOKEN:-}
      EDGE_ALLOWED_ORIGINS: ${EDGE_ALLOWED_ORIGINS:-}
      EDGE_REQUIRE_TOKEN: ${EDGE_REQUIRE_TOKEN:-false}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - outbox_data:/app/outbox
      - hls_data:/tmp/hls
    # GPU support (requires nvidia-container-toolkit on the host)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - rlvd-net

volumes:
  postgres_data:
  minio_data:
  hls_data:
  outbox_data:

networks:
  rlvd-net:
    driver: bridge
