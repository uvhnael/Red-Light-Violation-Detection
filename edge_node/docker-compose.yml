# Edge Node docker-compose stack
# Run from project root: docker compose -f edge_node/docker-compose.yml up -d
#
# Redis/Celery đã bị loại bỏ: vi phạm được gửi qua durable outbox trực tiếp
# tới central-server, không cần broker trung gian.

networks:
  rlvd-net:
    external: true
    name: rlvd-net

services:
  # ---------- Vision Pipeline + Control API ----------
  edge-pipeline:
    build:
      context: ..
      dockerfile: edge_node/Dockerfile
    restart: unless-stopped
    command: >
      python -m edge_node
        --input ${VIDEO_INPUT:-data/videos/16h30.25.9.22.mp4}
        ${STOP_LINE:+--stop-line ${STOP_LINE}}
        --direction ${CROSSING_DIRECTION:-any}
        --start-api
        --loop
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - CENTRAL_SERVER_URL=${CENTRAL_SERVER_URL:-http://central-server:8000/api/violations}
      # Must match the --input CLI arg: the control-plane API reads
      # settings.video_input for /api/cameras and /api/calibration/snapshot.
      - VIDEO_INPUT=${VIDEO_INPUT:-data/videos/16h30.25.9.22.mp4}
      - YOLO_MODEL_PATH=${YOLO_MODEL_PATH:-models/yolo26m_vehicle.pt}
      - YOLO_DEVICE=${YOLO_DEVICE:-}
      - YOLO_FP16=${YOLO_FP16:-}
      - ENABLE_OCR=${ENABLE_OCR:-true}
      - OCR_MODEL_NAME=${OCR_MODEL_NAME:-global-plates-mobile-vit-v2-model}
      - OCR_DEVICE=${OCR_DEVICE:-auto}
      - NODE_ID=${NODE_ID:-edge-node-01}
      # Live HLS camera feed (served at /api/cameras for the web dashboard)
      - CAMERA_STREAM_ENABLED=true
      - CAMERA_STREAM_HLS_DIR=/tmp/hls/cam-1
      - CAMERA_NAME=${CAMERA_NAME:-}
      - CAMERA_LOCATION=${CAMERA_LOCATION:-}
      # Durable outbox (survives network outages + container restarts)
      - OUTBOX_ENABLED=true
      - OUTBOX_DB_PATH=/app/outbox/violations.db
      - OUTBOX_BATCH_SIZE=${OUTBOX_BATCH_SIZE:-20}
      - OUTBOX_FLUSH_INTERVAL=${OUTBOX_FLUSH_INTERVAL:-5}
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - outbox_data:/app/outbox
      - hls_data:/tmp/hls
    # GPU support (requires nvidia-container-toolkit on the host)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - rlvd-net

volumes:
  hls_data:
  outbox_data: